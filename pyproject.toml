[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beetstreamnext"
version = "1.9.9"
description = "Fully-featured music server for Beets.io music libraries implementing the OpenSubsonic API"
authors = [
    {name = "Florent Le Moël", email = "25004801+FlorentLM@users.noreply.github.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "beets>=2.12.0",
    "flask-cors>=6.0.5",
    "cryptography>=46.0.7",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "waitress>=3.0.2",
    "paste>=0.2.1",
    "requests-cache>=1.3.3",
    "python-dotenv>=1.2.2",
    "werkzeug>=3.1.8",
    "pylast>=7.1.0",
    "flask-wtf>=1.3.0",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/FlorentLM/BeetstreamNext"

[project.scripts]
beetstreamnext = "beetsplug.beetstreamnext.standalone_mode:main"

[project.optional-dependencies]
wiki = ["wikipedia-api>=0.15.0"]
podcasts = ["feedparser>=6.0.11"]
podcast-discovery = ["python-podcastindex>=1.15.0"]
radio-discovery = ["radios>=0.3.2"]
sonos = ["soco>=0.30.0"]
chromecast = ["pychromecast>=14.0.0"]
all = ["beetstreamnext[wiki,podcasts,podcast-discovery,radio-discovery,sonos,chromecast]"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]
