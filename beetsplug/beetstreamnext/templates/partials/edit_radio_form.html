<form id="editRadioForm" enctype="multipart/form-data"
      hx-post="{{ url_for('admin.route_update_radio', station_id=station.id) }}"
      hx-encoding="multipart/form-data"
      hx-target="#radioList"
      hx-swap="innerHTML">
    {{ radio_form.csrf_token }}
    <div class="modal-result" id="editRadioResult"></div>

    <div class="form-group">
        <label>Name</label>
        {{ radio_form.name(id="editRadioName") }}
    </div>

    <div class="form-group">
        <label>Stream URL</label>
        {{ radio_form.streamUrl(id="editRadioStreamUrl") }}
    </div>

    <div class="form-group">
        <label>Homepage URL <span class="label-hint">(optional)</span></label>
        {{ radio_form.homepageUrl(id="editRadioHomepageUrl") }}
    </div>

    <div class="form-group">
        <label>Icon <span class="label-hint">(optional)</span></label>

        <div class="radio-icon-row">
            <button type="button" class="radio-icon-frame" data-action="pick-radio-icon"
                    data-target="editRadioImage" aria-label="Choose station icon">
                <img id="editRadioImagePreview" class="{{ '' if station.has_image else 'hidden' }}" alt=""
                     {% if station.has_image %}src="{{ url_for('admin.route_serve_radio_image', station_id=station.id) }}"{% endif %}>
                <span class="radio-icon-edit-overlay"><span class="material-symbols-outlined">edit</span></span>
            </button>
            <span class="label-hint">Click to change the icon.</span>
        </div>

        <input type="file" id="editRadioImage" name="image" accept="image/jpeg,image/png,image/webp"
               class="hidden">
        <label class="role-item role-item-standalone">
            <input type="checkbox" name="remove_image" id="editRadioRemoveImage"> Remove current icon
        </label>
    </div>

    <button type="submit" class="btn btn-primary btn-full">Save changes</button>
</form>
