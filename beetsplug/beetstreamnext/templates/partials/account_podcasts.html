{% from '_macros.html' import podcast_title %}

{% if message %}
    <div class="flash flash-{{ 'success' if ok else 'error' }}">{{ message }}</div>
{% endif %}

{% for text, category in notices or [] %}
    <div class="flash flash-{{ category }}">{{ text }}</div>
{% endfor %}

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Podcast</th>
            <th class="cell-right">Actions</th>
        </tr>
        </thead>
        <tbody>
        {% for p in podcasts %}
            <tr>
                <td>
                    {{ podcast_title(p, error_badge=true) }}
                </td>
                <td class="actions-cell">
                    <button class="icon-btn icon-btn-delete" title="Unsubscribe" aria-label="Unsubscribe"
                            hx-post="{{ url_for('account.route_unsubscribe_podcast', channel_id=p.id) }}"
                            hx-target="#accountPodcasts"
                            hx-swap="innerHTML"
                            hx-confirm="Unsubscribe from this podcast?">
                        <span class="material-symbols-outlined">delete_forever</span>
                    </button>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="2" class="empty-state">You're not subscribed to any podcasts.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
