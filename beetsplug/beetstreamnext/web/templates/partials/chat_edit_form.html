<div class="chat-msg chat-editing" id="chat-msg-{{ m.id }}" data-id="{{ m.id }}" data-user="{{ m.username }}"

     data-time="{{ m.time | int }}">

    <form class="chat-edit-form"
          hx-post="{{ url_for(bp_name ~ '.route_edit_chat_message', msg_id=m.id) }}"
          hx-target="#chat-msg-{{ m.id }}"
          hx-swap="outerHTML"
          hx-disable="find button">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="sr-only" for="chat-edit-{{ m.id }}">Edit message from {{ m.username }}</label>
        <textarea id="chat-edit-{{ m.id }}" name="message" rows="2" maxlength="{{ CHAT_MAX_CHARS }}"
                  required>{{ draft if draft is defined else m.message }}</textarea>

        {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

        <div class="chat-edit-buttons">
            <button type="button" class="btn btn-outline"
                    hx-get="{{ url_for(bp_name ~ '.route_chat_message', msg_id=m.id) }}"
                    hx-target="#chat-msg-{{ m.id }}"
                    hx-swap="outerHTML">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>

</div>
