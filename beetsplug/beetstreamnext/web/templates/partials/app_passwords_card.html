<div id="appPasswordSlot"></div>
<div class="card">
    <div class="table-header"><h2><span class="material-symbols-outlined">password</span>App passwords</h2></div>
    <p class="card-hint">
        Create revocable passwords for your Subsonic client(s). Each can be used as a password or as an API key.
    </p>
    <form hx-post="{{ url_for(bp_name ~ '.route_create_app_password') }}"
          hx-target="#appPasswordResult"
          hx-swap="innerHTML" class="card-body-form">
        {{ app_password_form.csrf_token }}
        <div class="form-group">
            <label>Name</label>
            {{ app_password_form.name(placeholder="Phone - Symfonium") }}
        </div>
        <div class="form-group form-row form-row-stack">
            <div>
                <label>Access</label>
                {{ app_password_form.role() }}
            </div>
            <div>
                <label>Expires</label>
                {{ app_password_form.expires_days() }}
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Create app password</button>
    </form>
    <div id="appPasswordResult"></div>
    <div id="appPasswordList"
         hx-get="{{ url_for(bp_name ~ '.route_list_app_passwords') }}"
         hx-trigger="load"
         hx-swap="innerHTML"></div>
</div>
