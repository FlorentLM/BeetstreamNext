<div class="modal-overlay" id="appPasswordModal" x-data="modalPanel('appPasswordModal')"
     :class="{ active: isOpen }" x-init="open()">
    <div class="modal-content">
        <button class="close-modal" @click="close()" aria-label="Close">&times;</button>
        <h2>App password created</h2>
        <p class="api-key-hint">
            Use it in your client as the <strong>password</strong> or as the <strong>API key</strong>.
            <br>
            <br>
            Copy it now, it will <strong>not</strong> be shown again.
        </p>
        <div class="api-key-box">
            <code id="appPasswordValue">{{ secret }}</code>
            <button type="button" class="btn btn-outline btn-copy" data-action="copy-api-key"
                    data-target="appPasswordValue">Copy
            </button>
        </div>
        <button type="button" class="btn btn-primary btn-full" @click="close()">
            I've saved it
        </button>
    </div>
</div>
