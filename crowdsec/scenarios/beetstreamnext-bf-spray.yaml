type: leaky
name: florentlm/beetstreamnext-bf-spray
description: "Detect BeetstreamNext credential stuffing (many different usernames from one IP)"
filter: "evt.Meta.log_type == 'beetstreamnext_auth_failure' && evt.Meta.target_user != ''"
leakspeed: "60s"
capacity: 3
distinct: evt.Meta.target_user
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  service: beetstreamnext
  type: bruteforce
  remediation: true
