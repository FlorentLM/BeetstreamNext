type: leaky
name: florentlm/beetstreamnext-bf
description: "Detect BeetstreamNext login brute force"
filter: "evt.Meta.log_type == 'beetstreamnext_auth_failure'"
leakspeed: "30s"
capacity: 5
groupby: evt.Meta.source_ip
blackhole: 1m
labels:
  service: beetstreamnext
  type: bruteforce
  remediation: true
