name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all

      - name: Lint (ruff, includes pyflakes rules)
        run: uv run ruff check .

  vendored-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Vendored JavaScript matches the pinned releases
        run: uv run tools/vendor_js.py --check

      - name: Vendored fonts match the pinned sources
        run: uv run tools/vendor_fonts.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Audit locked dependencies (pip-audit)
        run: |
          uv export --locked --no-emit-project --extra all -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

      - name: SAST (bandit)
        run: uvx bandit -q -r beetsplug -ll
