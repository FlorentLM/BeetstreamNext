# Standalone BeetstreamNext only, pointed at a library.db + music root managed elsewhere
# (your own machine, or another container - see docs for a small multi-container stack example)
#
# Usage:
#   1. Edit the two host paths below (library.db and your music root)
#      1b. Optional, run once (see https://florentlm.github.io/BeetstreamNext/installation.html#unattended-first-run):
#           docker compose -f docker/docker-compose.yml run --rm -e BSN_ADMIN_USER=admin -e BSN_ADMIN_PASSWORD=Hunter2?? beetstreamnext create-user --noinput
#   2. Run it:
#     docker compose -f docker/docker-compose.yml up -d   (from the repository root, or just `docker compose up -d` from this folder)
#
# To build the image locally instead, comment out `image:` and uncomment `build:` below

services:
  beetstreamnext:
    image: ghcr.io/florentlm/beetstreamnext:latest
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile   # required if you build from another location (the Dockerfile isn't at the repo root)
    container_name: beetstreamnext
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      BEETS_LIBRARY_DB: /data/library.db
      MUSIC_ROOT: /music
    volumes:
      - ./config:/config
      - /path/to/library.db:/data/library.db:ro
      - /path/to/music:/music:ro
