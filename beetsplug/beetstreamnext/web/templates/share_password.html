{% extends "base.html" %}

{% block title %} - Protected share{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block body %}
    <div class="login-wrapper">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="BeetstreamNext" class="logo-medium">
        </div>
        <div class="login-card">
            <h2>Protected share</h2>
            {% if blocked %}
                <div class="flash flash-error">Too many failed attempts. Try again later.</div>
            {% elif wrong %}
                <div class="flash flash-error">Wrong password.</div>
            {% endif %}
            <form method="post" action="{{ url_for('public.share_unlock', share_id=share.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" autocomplete="off" required autofocus>
                </div>
                <button type="submit" class="btn-submit">Unlock</button>
            </form>
        </div>
    </div>
{% endblock %}
